<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | THE 3'Ps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="page-dashboard">
  <div id="site-nav"></div>

  <main class="container my-5">
    <h1 id="greeting" class="mb-1">Hello!</h1>
    <p id="todayDate" class="mb-4"></p>

    <div class="card mb-4"><div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="mb-0">Today's Progress</h2>
        <button class="btn btn-sm btn-outline-accent" id="enableNotif"><i class="bi bi-bell"></i> Enable reminders</button>
      </div>
      <div class="progress mb-2" style="height:1.5rem" role="progressbar" aria-label="Daily progress">
        <div class="progress-bar" id="progressBar" style="width:0%">0%</div>
      </div>
      <p class="mb-0" id="progressMsg"></p>
    </div></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card h-100"><div class="card-body">
          <h2>Today's Tasks</h2>
          <ul class="list-group list-group-flush" id="todayList"></ul>
        </div></div>
      </div>
      <div class="col-lg-5">
        <div class="card h-100"><div class="card-body">
          <h2>Coming Up (next 7 days)</h2>
          <div id="upcoming"></div>
        </div></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
