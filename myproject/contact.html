<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | THE 3'Ps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="page-contact">
  <div id="site-nav"></div>

  <main class="container my-5" style="max-width:700px">
    <h1 class="mb-2">Contact Us</h1>
    <p class="mb-4">Questions or ideas? We'd love to hear from you.</p>

    <div class="card"><div class="card-body">
      <form id="contactForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="cName">Your name</label>
          <input class="form-control" id="cName" required>
          <div class="invalid-feedback">Please enter your name.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="cEmail">Email</label>
          <input type="email" class="form-control" id="cEmail" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="cMsg">Message</label>
          <textarea class="form-control" id="cMsg" rows="5" minlength="10" required></textarea>
          <div class="invalid-feedback">Please write at least 10 characters.</div>
        </div>
        <button type="submit" class="btn btn-accent">Send Message</button>
      </form>
      <div class="alert alert-success mt-3 d-none" id="thanks">Thank you! Your message was received.</div>
    </div></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>

  <script>
    const FORMSPREE_URL = 'https://formspree.io/f/mwlpdgww';

    const cForm = document.getElementById('contactForm');
    cForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!cForm.checkValidity()) { cForm.classList.add('was-validated'); return; }

      const btn = cForm.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(FORMSPREE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: cName.value.trim(),
            email: cEmail.value.trim(),
            message: cMsg.value.trim()
          })
        });
        if (!res.ok) throw new Error('Failed');
        cForm.reset();
        cForm.classList.remove('was-validated');
        document.getElementById('thanks').classList.remove('d-none');
      } catch {
        showToast('Sorry, the message could not be sent. Please try again.', 'danger');
      }
      btn.disabled = false;
      btn.textContent = 'Send Message';
    });
  </script>
</body>
</html>
